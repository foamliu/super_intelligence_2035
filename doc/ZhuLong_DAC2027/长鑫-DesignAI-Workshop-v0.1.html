<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="长鑫 AI+半导体 Workshop：Design AI 20 分钟最终演讲版。" />
  <title>长鑫 Design AI｜20 分钟最终演讲版</title>
  <style>
    :root {
      --bg: #020706;
      --panel: #07100f;
      --ink: #f4f5f0;
      --muted: #87938d;
      --line: rgba(213, 238, 229, 0.16);
      --green: #71f6bd;
      --amber: #ffb85c;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: ui-serif, "Songti SC", "Noto Serif CJK SC", STSong, serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(113, 246, 189, 0.09), transparent 30%),
        var(--bg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app { position: relative; width: 100%; height: 100%; }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr);
      align-items: center;
      gap: 18px;
      height: 62px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(3, 10, 9, 0.94);
      backdrop-filter: blur(12px);
      transition: opacity 180ms ease;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand strong { color: var(--green); font-size: 15px; letter-spacing: 0.04em; white-space: nowrap; }
    .brand span { overflow: hidden; color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-overflow: ellipsis; white-space: nowrap; }

    .timer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 160px;
    }

    .timer {
      color: #dce5e1;
      font: 650 19px/1 var(--serif);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .recommended { color: #6f7c75; font-size: 10px; white-space: nowrap; }

    .controls { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

    .control {
      height: 32px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #bbc5c0;
      background: rgba(9, 22, 19, 0.82);
      cursor: pointer;
      font-size: 11px;
      font-weight: 760;
      white-space: nowrap;
    }

    .control:hover,
    .control.active { color: var(--green); border-color: rgba(113, 246, 189, 0.55); }
    .control:disabled { opacity: 0.3; cursor: default; }

    .stage {
      position: absolute;
      inset: 62px 0 38px;
      display: grid;
      place-items: center;
      padding: 14px 22px;
      transition: inset 180ms ease;
    }

    .frame-shell {
      position: relative;
      width: min(calc(100vw - 44px), calc((100vh - 128px) * 16 / 9));
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(113, 246, 189, 0.2);
      background: var(--panel);
      box-shadow: 0 28px 85px rgba(0, 0, 0, 0.42);
    }

    .slide-frame {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--panel);
    }

    .slide-frame.active { display: block; }

    .bottombar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      height: 38px;
      padding: 0 22px;
      border-top: 1px solid var(--line);
      background: rgba(3, 10, 9, 0.92);
      transition: opacity 180ms ease;
    }

    .progress-track { position: relative; height: 2px; background: rgba(213, 238, 229, 0.12); }
    .progress-fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--green), var(--amber)); transition: width 260ms ease; }
    .page-readout { color: #89958f; font-size: 11px; font-weight: 760; letter-spacing: 0.06em; white-space: nowrap; }
    .page-readout strong { color: var(--green); font-weight: 850; }

    .overview {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: none;
      place-items: center;
      padding: 42px;
      background: rgba(1, 7, 6, 0.94);
      backdrop-filter: blur(18px);
    }

    .overview.open { display: grid; }

    .overview-panel {
      width: min(1120px, 92vw);
      max-height: 88vh;
      padding: 28px 30px 30px;
      overflow: auto;
      border: 1px solid rgba(113, 246, 189, 0.24);
      background: #07100f;
      box-shadow: 0 34px 100px rgba(0, 0, 0, 0.5);
    }

    .overview-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .overview-head h2 { margin: 0; font: 650 30px/1.1 var(--serif); }
    .overview-head p { margin: 0; color: var(--muted); font-size: 12px; }

    .overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

    .overview-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 13px;
      min-height: 82px;
      padding: 14px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(12, 28, 24, 0.65);
      cursor: pointer;
      text-align: left;
    }

    .overview-item:hover,
    .overview-item.active { border-color: rgba(113, 246, 189, 0.58); background: rgba(20, 48, 39, 0.62); }
    .overview-number { color: var(--green); font: 650 23px/1 var(--serif); }
    .overview-title { font: 650 16px/1.3 var(--serif); }
    .overview-time { color: var(--amber); font-size: 10px; font-weight: 800; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 58px;
      z-index: 100;
      max-width: min(700px, 86vw);
      padding: 11px 16px;
      border: 1px solid rgba(113, 246, 189, 0.3);
      color: #dce5e1;
      background: rgba(4, 15, 12, 0.96);
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    body.clean .topbar,
    body.clean .bottombar { opacity: 0; pointer-events: none; }
    body.clean .stage { inset: 0; padding: 0; }
    body.clean .frame-shell { width: min(100vw, 177.7778vh); border: 0; box-shadow: none; }

    @media (max-width: 1120px) {
      .topbar { grid-template-columns: auto auto 1fr; }
      .brand span, .recommended { display: none; }
      .control.optional { display: none; }
      .overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      html, body { width: auto; height: auto; overflow: visible; background: #07100f; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .topbar, .bottombar, .overview, .toast { display: none !important; }
      .app, .stage, .frame-shell { position: static; display: block; width: auto; height: auto; padding: 0; border: 0; box-shadow: none; }
      .slide-frame,
      .slide-frame.active {
        position: relative;
        display: block !important;
        width: 16in;
        height: 9in;
        page-break-after: always;
        break-after: page;
      }
      .slide-frame:last-child { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>

    const frameShell = document.getElementById('frameShell');
    const frames = [];
    let current = 0;
    let editMode = false;
    let elapsedSeconds = 0;
    let timerHandle = null;
    let toastHandle = null;

    function decodeHtml(base64) {
      const bytes = Uint8Array.from(atob(base64), character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    slides.forEach((slide, index) => {
      const frame = document.createElement('iframe');
      frame.className = 'slide-frame';
      frame.title = slide.number + ' · ' + slide.title;
      frame.dataset.index = String(index);
      frame.srcdoc = decodeHtml(slide.htmlBase64);
      frameShell.appendChild(frame);
      frames.push(frame);
    });

    const overviewGrid = document.getElementById('overviewGrid');
    slides.forEach((slide, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'overview-item';
      button.dataset.index = String(index);
      button.innerHTML = '<span class="overview-number">' + slide.number + '</span><span class="overview-title">' + slide.title + '</span><span class="overview-time">' + slide.duration + '</span>';
      button.addEventListener('click', () => { show(index); toggleOverview(false); });
      overviewGrid.appendChild(button);
    });

    function syncFrameMode(frame) {
      frame.contentWindow?.postMessage({ type: 'cxmt-deck-edit', enabled: editMode }, '*');
    }

    function show(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      frames.forEach((frame, frameIndex) => frame.classList.toggle('active', frameIndex === current));
      document.querySelectorAll('.overview-item').forEach((item, itemIndex) => item.classList.toggle('active', itemIndex === current));
      document.getElementById('currentTitle').textContent = slides[current].title;
      document.getElementById('recommended').textContent = '本页建议 ' + slides[current].duration;
      document.getElementById('pageNumber').textContent = slides[current].number;
      document.getElementById('pageTotal').textContent = String(slides.length).padStart(2, '0');
      document.getElementById('progressFill').style.width = (((current + 1) / slides.length) * 100) + '%';
      document.getElementById('previousBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === slides.length - 1;
      syncFrameMode(frames[current]);
    }

    function toggleOverview(force) {
      const overview = document.getElementById('overview');
      const open = typeof force === 'boolean' ? force : !overview.classList.contains('open');
      overview.classList.toggle('open', open);
      if (open) document.querySelector('.overview-item[data-index="' + current + '"]')?.focus();
    }

    function toggleEdit() {
      editMode = !editMode;
      document.getElementById('editBtn').textContent = editMode ? '锁定演示' : '开启编辑';
      document.getElementById('editBtn').classList.toggle('active', editMode);
      frames.forEach(syncFrameMode);
      showToast(editMode ? '编辑已开启：直接点击页面文字修改，内容仍由各页自动保存' : '页面已锁定，避免演示时误改文字');
    }

    function toggleClean(force) {
      const enabled = typeof force === 'boolean' ? force : !document.body.classList.contains('clean');
      document.body.classList.toggle('clean', enabled);
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.().catch(() => {});
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return String(minutes).padStart(2, '0') + ':' + String(remainder).padStart(2, '0');
    }

    function toggleTimer() {
      if (timerHandle) {
        clearInterval(timerHandle);
        timerHandle = null;
        document.getElementById('timerBtn').textContent = '继续计时';
        return;
      }
      document.getElementById('timerBtn').textContent = '暂停计时';
      timerHandle = setInterval(() => {
        elapsedSeconds += 1;
        document.getElementById('timer').textContent = formatTime(elapsedSeconds);
      }, 1000);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastHandle);
      toastHandle = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function inspectPlaceholders() {
      const findings = [];
      frames.forEach((frame, index) => {
        try {
          const text = frame.contentDocument?.body?.innerText || '';
          const matches = text.match(/\[(?:X|N|P|_{2,}|[^\]]*_{2,}[^\]]*)\]%?/g) || [];
          const needsReplacement = /请替换|填入真实|DRAFT/i.test(text);
          if (matches.length || needsReplacement) {
            findings.push(slides[index].number + ' ' + slides[index].title + '：' + ([...new Set(matches)].join('、') || '存在 DRAFT 提示'));
          }
        } catch (_) {}
      });
      if (!findings.length) showToast('未发现常见数据占位符');
      else alert('正式发布前请检查：\n\n' + findings.join('\n'));
    }

    function handleKey(key) {
      if (key === 'Escape') {
        if (document.getElementById('overview').classList.contains('open')) toggleOverview(false);
        else if (document.body.classList.contains('clean')) toggleClean(false);
        return;
      }
      if (key === 'ArrowLeft' || key === 'PageUp') show(current - 1);
      if (key === 'ArrowRight' || key === 'PageDown' || key === ' ') show(current + 1);
      if (key === 'Home') show(0);
      if (key === 'End') show(slides.length - 1);
      if (key === 'o' || key === 'O') toggleOverview();
      if (key === 'f' || key === 'F') toggleFullscreen();
      if (key === 'h' || key === 'H') toggleClean();
      if (key === 't' || key === 'T') toggleTimer();
    }

    document.getElementById('previousBtn').addEventListener('click', () => show(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => show(current + 1));
    document.getElementById('overviewBtn').addEventListener('click', () => toggleOverview());
    document.getElementById('editBtn').addEventListener('click', toggleEdit);
    document.getElementById('placeholderBtn').addEventListener('click', inspectPlaceholders);
    document.getElementById('cleanBtn').addEventListener('click', () => toggleClean());
    document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('timerBtn').addEventListener('click', toggleTimer);

    window.addEventListener('message', (event) => {
      const frameIndex = frames.findIndex(frame => frame.contentWindow === event.source);
      if (frameIndex < 0) return;
      if (event.data?.type === 'cxmt-frame-ready') syncFrameMode(frames[frameIndex]);
      if (event.data?.type === 'cxmt-deck-key') handleKey(event.data.key);
    });

    document.addEventListener('keydown', (event) => {
      if (event.target?.closest?.('button, input, textarea, select, a')) return;
      const supported = ['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', ' ', 'Escape', 'o', 'O', 'f', 'F', 'h', 'H', 't', 'T'];
      if (!supported.includes(event.key)) return;
      event.preventDefault();
      handleKey(event.key);
    });

    document.addEventListener('fullscreenchange', () => {
      document.getElementById('fullscreenBtn').textContent = document.fullscreenElement ? '退出全屏' : '全屏';
    });

    show(0);
  </script>
</body>
