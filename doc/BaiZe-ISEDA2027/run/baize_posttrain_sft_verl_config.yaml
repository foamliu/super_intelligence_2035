# baize_posttrain_sft_verl_config.yaml — verl 0.4.0 FSDP SFT for MiniCPM5-2B on 4xA40
# R114: SFT framework = verl FSDP SFT (unified with RL toolchain)
# Uses MultiTurnSFTDataset with messages_key='conversation' — directly compatible.

data:
  train_batch_size: 128
  micro_batch_size_per_gpu: 2
  train_files: sft_pyaether_corpus_v2.parquet  # R115 fix: was sft_blended_v1.parquet (never created)
  val_files: null
  multiturn:
    enable: true
    messages_key: conversation
    tools_key: null
  max_length: 16384
  truncation: left
  balance_dp_token: false
  chat_template: null
  use_shm: false

model:
  partial_pretrain: /nas_data/app.e0031982/models/MiniCPM5-2B
  use_shm: false
  fsdp_config:
    model_dtype: bf16
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false
  enable_gradient_checkpointing: true
  trust_remote_code: true
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  use_liger: false
  strategy: fsdp2
  use_remove_padding: true

optim:
  lr: 2e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.03
  clip_grad: 1.0
  lr_scheduler: wsd

ulysses_sequence_parallel_size: 1
use_remove_padding: true

trainer:
  default_local_dir: /nas_data/app.e0031982/code/BaiZe-ISEDA2027/nemo_experiments/baize_posttrain_sft
  default_hdfs_dir: null
  resume_path: null
  project_name: baize-posttrain-sft
  experiment_name: sft-v1-ctx16k
  total_epochs: 3
  total_training_steps: 3000
  logger: ['console', 'wandb']
  seed: 42
  save_freq: 300
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 4
  max_ckpt_to_keep: 3
