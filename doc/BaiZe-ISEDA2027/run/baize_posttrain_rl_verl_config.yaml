# baize_posttrain_rl_verl_config.yaml — verl GRPO config for MiniCPM5-2B on 4×A40
#
# Purpose: Concrete verl configuration for the surrogate RL rehearsal
#          (MiniCPM5-2B + EDA sandbox + GRPO). To be used after GPU arrival (11/9).
#
# WARNING: Surrogate RL results are NOT transferable to BaiZe.
#          This config validates the method chain and produces reusable
#          pipeline artifacts only.
#
# 🔴 R9 UPDATE (2026-11-07): Switched from vLLM to SGLang inference backend.
#   R8 discovered MiniCPM5-2B uses XML-format tool calls that vLLM cannot parse.
#   SGLang has built-in minicpm5 tool-call parser. verl natively supports SGLang
#   for multi-turn rollout (actor_rollout_ref.rollout.name: "sglang" + multi_turn: True).
#   See EXPERIMENTS_POSTTRAIN.md §R9 for full rationale.
#
# Usage (after verl[sglang] is installed):
#   python -m verl.trainer.main_ppo \
#       --config baize_posttrain_rl_verl_config.yaml \
#       --reward-arm R2 --smoke
#
# See EXPERIMENTS_POSTTRAIN.md §R5 (design) and §R9 (SGLang integration) for rationale.

data:
  tokenizer: /tmp/models/MiniCPM5-2B
  train_files: rl_pyaether_synth_v2.parquet  # ✅ R10: 3347 tasks, 931KB, verl RLHF parquet (R21: fixed relative path)
  val_files: null
  train_batch_size: 128          # G=8 × 16 prompts per iter
  prompt_key: prompt
  max_prompt_length: 4096
  max_response_length: 4096      # 8192 total context (R6: covers 95%+ traces)
  return_raw_chat: True          # Required for async rollout + multi-turn (R10)
  need_tools_kwargs: True        # 🔴 R10: inject tool definitions into prompt (Tool Agent Loop)
  # 🔴 R15: agent_name_key removed — it's for the Interaction System (BaseInteraction),
  #   not the Tool Agent Loop (BaseTool). Tool selection is via tools_config_file.
  # agent_name_key: agent_name   # ← REMOVED (R15): not needed for Tool Agent Loop approach
  shuffle: True
  seed: 42
  filter_overlong_prompts: True
  truncation: error
  trust_remote_code: True

actor_rollout_ref:
  hybrid_engine: True             # Training and inference share same GPUs (3D-HybridEngine)

  model:
    path: /tmp/models/MiniCPM5-2B
    override_config:
      attn_implementation: flash_attention_2
    enable_gradient_checkpointing: True
    trust_remote_code: True
    use_remove_padding: True

  actor:
    strategy: fsdp
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2              # Standard PPO/GRPO clip
    entropy_coeff: 0.001          # 🔴 R21 FIX: R18 recommended 0.001 (was 0.0) to prevent policy collapse
    use_kl_loss: True            # Required for GRPO
    kl_loss_coef: 0.02           # 🔴 R21 FIX: R18 recommended staged 0.04→0.02→0.01; start at 0.02 (was 0.04)
    kl_loss_type: low_var_kl     # GRPO standard
    ppo_epochs: 2                # 🔴 R21 FIX: R18 recommended 2 (was 1) for better sample efficiency
    use_torch_compile: False     # Disabled for A40 (compile overhead > benefit at 2B)
    entropy_checkpointing: True  # 🔴 R11: entropy computation memory optimization (vocab=130560)
    optim:
      lr: 3.0e-6                    # 🔴 R21 FIX: R18 recommended 3e-6 (was 1e-6) to avoid misjudging RL as ineffective
      lr_warmup_steps: 50
      lr_scheduler_type: constant
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: False       # 2B fits in 4×A40 without offload
      optimizer_offload: False
      fsdp_size: -1

  ref:
    fsdp_config:
      param_offload: False
      log_prob_micro_batch_size_per_gpu: 8
    entropy_from_logits_with_chunking: True  # 🔴 R11: chunked logits entropy to reduce memory peak

  rollout:
    name: sglang                 # 🔴 CHANGED from vll → sglang (R8/R9)
    mode: async                  # Server-based async rollout (avoids GPU idle during sandbox)
    multi_turn: True             # ✅ R15 verified: verl docs confirm `multi_turn: True` (boolean)
    multi_turn_config:
      tokenization_sanity_check_mode: strict  # 🔴 R11: delta tokenization consistency check
      format: minicpm5           # 🔴 R16: verl's OWN ToolParser (not SGLang's) — registers "minicpm5"
                                 #   Parses XML: <function name="..."><param name="...">value</param></function>
                                 #   Import baize_posttrain_minicpm5_parser before training to register.
                                 #   See EXPERIMENTS_POSTTRAIN.md §R16 for full rationale.
      # 🔴 R20 (2026-11-07): Added missing multi-turn parameters
      max_assistant_turns: 3     # R20-C2: CRITICAL — controls state machine loop count
                                 #   agent.max_turns below is custom metadata, NOT read by verl
      max_parallel_calls: 1      # R20-C4: EDA tasks require sequential API calls (no parallel)
      max_tool_response_length: 2048  # R20-C3: truncate sandbox output to prevent context overflow
      tool_response_truncate_side: end  # R20-C3: keep beginning of output, truncate tail
    temperature: 1.0             # Training: high exploration
    top_p: 0.95
    prompt_length: 4096
    response_length: 4096
    dtype: bfloat16
    gpu_memory_utilization: 0.50 # 🔴 R11: raised from 0.35 → 0.50 (3-turn KV cache needs 13.8GB, 0.35=11.9GB insufficient)
    enforce_eager: True          # Disable CUDA graph (co-located safety)
    tensor_model_parallel_size: 1  # Each A40 gets its own SGLang instance
    max_num_seqs: 12             # 🔴 R11: reduced from 16 → 12 (lower KV cache peak: 12×860MB=10.3GB)
    # 🔴 R16: SGLang's tool_call_parser is NOT needed — verl has its own ToolParser
    #   layer (verl/experimental/agent_loop/tool_parser.py) that parses tool calls
    #   from model output text. SGLang just generates text; verl parses XML tags.
    #   The "minicpm5" parser is registered by baize_posttrain_minicpm5_parser.py.
    # Tool configuration for EDA sandbox (verl Tool Agent Loop approach)
    tool_kwargs:
      tools_config_file: baize_posttrain_eda_tools.yaml  # ✅ R15: fixed OpenAI Function format (R21: fixed relative path)

algorithm:
  name: grpo
  group_size: 8                  # G=8 for 2B model (arXiv:2608.14109 used G=4)
  advantage_type: group_norm     # A_i = (R_i - mu) / (sigma + eps)
  filter_groups: true            # Drop all-correct and all-wrong groups (sGPO)
  eps: 1.0e-8

reward:
  # 🔴 R13: Custom reward function — verl interface via custom_reward_function
  # The reward function implements 4 arms (R1-R4) in baize_posttrain_reward_functions.py
  # verl loads it via load_reward_manager() → custom_reward_function.path + .name
  custom_reward_function:
    path: baize_posttrain_reward_functions.py  # R21: fixed relative path (was run/baize_posttrain_reward_functions.py)
    name: compute_score
    reward_kwargs:
      arm: R2                    # START with R2 (partial credit), NOT R1 (binary)
      api_database: ~/code/eda_fastmcp/docs/API_INFO_MERGED_V3.json
  # Arm descriptions (for reference, actual logic in reward_functions.py):
  # R1 = binary pass/fail (too sparse for 2B)
  # R2 = exec_success(0.2) + partial_assert(0.2 each) + full_pass(1.0)
  # R3 = R2 + tool_call_penalty (align with harness cost model)
  # R4 = R3 + API_legality (penalize hallucinated API names)
  assertion_source: task.test
  anti_cheat:
    enabled: true                # Red line §5.2: PreToolUse hook always on
    ngram_blocklist: baize_posttrain_contamination_gate.sh  # R21: fixed relative path
    report_cheat_rate: true
    report_interval: 200

agent:
  max_turns: 3                   # Align with DeepSeek Phi=5 median 3-6
  task_timeout: 2500             # Eval protocol frozen value
  sandbox_concurrency: 8         # 4 GPUs × 2 concurrent sandbox calls
  sandbox_endpoint: ssh://tunnel-to-36.15
  sandbox_hosts:
    - pyAether
    - aether
    - skill_virtuoso
    - tcl_innovus
    - tcl_waveview

trainer:
  total_epochs: 1
  save_interval: 200
  save_dir: /nas_data/app.e0031982/code/BaiZe-ISEDA2027/nemo_experiments/baize_posttrain_rl_grpo  # R12: /nas_train empty on .17
  log_dir: /nas_data/app.e0031982/code/BaiZe-ISEDA2027/nemo_experiments/baize_posttrain_rl_grpo/logs
  log_interval: 10
  cheat_rate_interval: 200
  tensorboard: true
  wandb: false                   # .17 has no external network

runtime:
  n_gpus: 4                      # 4×A40 on .17
  ray_address: auto              # Local Ray cluster
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_TIMEOUT: "1800"
    OMP_NUM_THREADS: "8"

# Smoke test overrides (use --smoke flag)
smoke:
  iters: 10
  save_interval: 5
  group_size: 4
  sandbox_concurrency: 2
  train_batch_size: 16
  output_suffix: _smoke
