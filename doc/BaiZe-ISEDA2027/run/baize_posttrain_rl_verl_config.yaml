# baize_posttrain_rl_verl_config.yaml — verl GRPO config for MiniCPM5-2B on 4×A40
#
# Purpose: Concrete verl configuration for the surrogate RL rehearsal
#          (MiniCPM5-2B + EDA sandbox + GRPO). To be used after GPU arrival (11/9).
#
# WARNING: Surrogate RL results are NOT transferable to BaiZe.
#          This config validates the method chain and produces reusable
#          pipeline artifacts only.
#
# Usage (after verl is installed):
#   python -m verl.trainer.main_ppo \
#       --config baize_posttrain_rl_verl_config.yaml \
#       --reward-arm R2 --smoke
#
# See EXPERIMENTS_POSTTRAIN.md §R5 for full design rationale.

train:
  policy_trainer:
    type: fsdp
    model:
      path: /tmp/models/MiniCPM5-2B
      dtype: bfloat16
    optimizer:
      type: adamw
      lr: 1.0e-6
      weight_decay: 0.0
    scheduler:
      type: constant_with_warmup
      warmup_steps: 50
    gradient_clip: 1.0
    save_interval: 200
    save_dir: /nas_train/app.e0031982/code/BaiZe-ISEDA2027/nemo_experiments/baize_posttrain_rl_grpo

algorithm:
  name: grpo
  group_size: 8            # G=8 for 2B model (arXiv:2608.14109 used G=4)
  clip_epsilon: 0.2        # Standard PPO/GRPO clip
  kl_coef: 0.04            # DeepSeek-R1 KL coefficient
  advantage_type: group_norm  # A_i = (R_i - mu) / (sigma + eps)
  filter_groups: true      # Drop all-correct and all-wrong groups (sGPO)
  eps: 1.0e-8              # Numerical stability

rollout:
  engine: vllm
  co_located: true         # Training and inference share same GPUs
  tensor_parallel_size: 1  # Each GPU gets its own vLLM instance
  gpu_memory_utilization: 0.35  # Leave 65% for FSDP training
  enforce_eager: true      # Disable CUDA graph (co-located safety)
  max_num_seqs: 16         # Reduced for co-location
  max_model_len: 8192      # Agentic traces can be long
  temperature: 1.0         # Training: high exploration
  top_p: 0.95
  max_tokens: 2048         # Per-turn generation limit

agent:
  name: eda_sandbox_agent  # Custom ToolAgentLoop (to be implemented)
  max_turns: 3             # Align with DeepSeek Phi=5 median 3-6
  task_timeout: 2500       # Eval protocol frozen value
  sandbox_concurrency: 8   # 4 GPUs x 2 concurrent sandbox calls
  sandbox_endpoint: ssh://tunnel-to-36.15
  sandbox_hosts:
    - pyAether
    - aether
    - skill_virtuoso
    - tcl_innovus
    - tcl_waveview
  anti_cheat:
    enabled: true          # Red line §5.2: PreToolUse hook always on
    ngram_blocklist: baize_posttrain_contamination_gate.sh
    report_cheat_rate: true
    report_interval: 200   # Every save_interval

reward:
  arm: R2                  # START with R2 (partial credit), NOT R1 (binary)
  # R1 = binary pass/fail (too sparse for 2B)
  # R2 = exec_success(0.2) + partial_assert(0.2 each) + full_pass(1.0)
  # R3 = R2 + tool_call_penalty (align with harness cost model)
  # R4 = R3 + API_legality (penalize hallucinated API names)
  assertion_source: task.test  # Use synth task's test field
  partial_credit:
    exec_success: 0.2      # Code ran without error
    partial_assert: 0.2    # Each assertion passed adds 0.2
    full_pass: 1.0         # All assertions passed
  api_database: ~/code/eda_fastmcp/docs/API_INFO_MERGED_V3.json  # For R4 legality check

data:
  train_path: run/rl_pyaether_synth_v2.jsonl  # 3347 synth tasks (E1 output)
  filter:
    difficulty: [L3, L4, L5]  # RL focus on medium-hard (1300 tasks)
    # pass_rate filter applied after E2 pass@8 calibration (GPU required)
  contamination_check: true   # Red line §5.1

runtime:
  n_gpus: 4                # 4×A40 on .17
  ray_address: auto        # Local Ray cluster
  env:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
    NCCL_TIMEOUT: "1800"
    OMP_NUM_THREADS: "8"   # CPU load reduction
  logging:
    wandb: false           # .17 has no external network
    tensorboard: true
    log_dir: /nas_train/app.e0031982/code/BaiZe-ISEDA2027/nemo_experiments/baize_posttrain_rl_grpo/logs
    log_interval: 10
    cheat_rate_interval: 200

# Smoke test overrides (use --smoke flag)
smoke:
  iters: 10
  save_interval: 5
  group_size: 4
  sandbox_concurrency: 2
  output_suffix: _smoke
