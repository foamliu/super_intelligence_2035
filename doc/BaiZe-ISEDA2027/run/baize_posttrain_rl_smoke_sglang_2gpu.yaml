# baize_posttrain_rl_smoke_sglang_2gpu.yaml — 2-GPU SGLang-rollout GRPO smoke
# (wake411, 2026-11-13)
#
# WHY: wake409/wake410 proved verl 0.4.0 1-GPU hybrid GRPO init DEADLOCKS
# (colocated WorkerDict register-center handshake, 2x repro, both HF & SGLang
# rollout, with/without KL). The UNTESTED hypothesis: does 2-GPU hybrid init
# work? 2 bundles are satisfiable on 2 GPUs, so the 1-GPU handshake stall may
# not occur. This smoke answers that with a FAST run (small ctx, G=4, 5 steps,
# no-KL to isolate init from ref-policy bundle). SGLang rollout = the
# throughput-viable engine needed for the full 200-step run (HF/NaiveRollout is
# token-by-token, not throughput-viable per wake409).
#
# ⚠️ Surrogate RL (MiniCPM5-2B), NOT BaiZe. Results NOT transferable to BaiZe.

defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - file:///home/app.e0031982/code/verl_cu124_venv/lib/python3.10/site-packages/verl/trainer/config

custom_reward_function:
  path: baize_posttrain_reward_functions.py
  name: compute_score
  reward_kwargs:
    arm: R0
    api_database: ~/code/eda_fastmcp/docs/API_INFO_MERGED_V3.json
    auto_fallback: true
    enable_scene_weighting: false
    scene_weight_config: rl_scene_weight_config_r300.json

data:
  tokenizer: /nas_data/app.e0031982/models/MiniCPM5-2B
  train_files: rl_pyaether_synth_v2.parquet
  val_files: rl_pyaether_synth_v2.parquet
  train_batch_size: 8
  prompt_key: prompt
  reward_fn_key: reward_model
  max_prompt_length: 1024
  max_response_length: 1024
  return_raw_chat: True
  need_tools_kwargs: True
  shuffle: True
  seed: 42
  filter_overlong_prompts: True
  truncation: error
  trust_remote_code: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: /nas_data/app.e0031982/models/MiniCPM5-2B
    override_config:
      attn_implementation: sdpa
    enable_gradient_checkpointing: True
    trust_remote_code: True
    use_remove_padding: True
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: False
    kl_loss_coef: 0.02
    kl_loss_type: low_var_kl
    ppo_epochs: 2
    use_torch_compile: False
    optim:
      lr: 3.0e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.01
  ref:
    strategy: fsdp
    log_prob_use_dynamic_bsz: True
    log_prob_max_token_len_per_gpu: 16384
  rollout:
    name: sglang
    mode: sync
    temperature: 0.7
    top_p: 0.95
    prompt_length: 1024
    response_length: 1024
    gpu_memory_utilization: 0.50
    enforce_eager: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 16384
    max_num_seqs: 24
    n: 4
    multi_turn:
      enable: False
      max_turns: 3
      tool_config_path: null
      format: chatml
    engine_kwargs:
      sglang:
        attention_backend: flashinfer

reward_model:
  enable: False
  reward_manager: naive

algorithm:
  adv_estimator: grpo
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1

critic:
  strategy: fsdp
  rollout_n: 4

trainer:
  total_epochs: 1
  total_training_steps: 5
  save_freq: 5
  project_name: baize_posttrain_rl_surrogate
  experiment_name: minicpm5_grpo_smoke_sglang_2gpu
  logger: ['console']
  log_val_generations: 0
  nnodes: 1
  n_gpus_per_node: 2
  ray_wait_register_center_timeout: 1800
  resume_mode: auto
  val_before_train: False
  test_freq: -1
  default_local_dir: /nas_data/app.e0031982/code/super_intelligence_2035/doc/BaiZe-ISEDA2027/run/rl_surrogate_runs/minicpm5_grpo_smoke_sglang_2gpu
  max_actor_ckpt_to_keep: 3
  device: cuda

ray_init:
  num_cpus: null
  timeline_json_file: null
