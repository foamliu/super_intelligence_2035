# baize_posttrain_rl_verl_config_v2_merged.yaml — v2 customizations INHERITED
# from verl 0.4.0's built-in ppo_trainer.yaml.
#
# R-launch-fix (2026-11-13): v2 was a standalone "complete rewrite" (R47 audit)
# but the INSTALLED verl 0.4.0's _validate_config / workers access keys that v2
# never defined (loss_agg_mode, fsdp_config, clip_ratio_low/high, ulysses_*,
# etc.), causing ConfigAttributeError. Fix: inherit the built-in default (which
# has every required key) and layer v2's values on top via `_self_`. Composition
# (unlike CLI overrides) may add new keys, so reward_kwargs / multi_turn are fine.
#
# The built-in default lives in the verl package config dir; hydra.searchpath
# below makes `ppo_trainer` resolvable from this repo-local file.
#
# ⚠️ Surrogate RL results are NOT transferable to BaiZe.

defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - file:///home/app.e0031982/code/verl_cu124_venv/lib/python3.10/site-packages/verl/trainer/config

# === TOP-LEVEL custom_reward_function (R47 BUG1 FIX) ===
custom_reward_function:
  path: baize_posttrain_reward_functions.py
  name: compute_score
  reward_kwargs:
    arm: R0                    # START with R0 (skeleton, no sandbox); switch to R2/R4 later
    api_database: ~/code/eda_fastmcp/docs/API_INFO_MERGED_V3.json
    auto_fallback: true        # R22: auto-switch to R0 when sandbox unavailable
    enable_scene_weighting: false
    scene_weight_config: rl_scene_weight_config_r300.json

data:
  tokenizer: /nas_data/app.e0031982/models/MiniCPM5-2B
  train_files: rl_pyaether_synth_v2.parquet
  val_files: rl_pyaether_synth_v2.parquet     # R-launch-fix: verl creates val_dataset unconditionally; point at train (test_freq=-1 ⇒ never used)
  train_batch_size: 128
  prompt_key: prompt
  reward_fn_key: reward_model      # R108 FIX: RL parquet column name
  max_prompt_length: 8192           # R61: prompts avg 17K tok, 8K captures most
  max_response_length: 8192         # R61: total ctx=16384
  return_raw_chat: True
  need_tools_kwargs: True
  shuffle: True
  seed: 42
  filter_overlong_prompts: True
  truncation: error
  trust_remote_code: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: /nas_data/app.e0031982/models/MiniCPM5-2B
    override_config:
      attn_implementation: sdpa      # R-launch-fix: flash_attention_2 crashes on CPU meta tensor during FSDP init → sdpa (mirrors SFT SDPA patch)
    enable_gradient_checkpointing: True
    trust_remote_code: True
    use_remove_padding: True
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.001          # R18: prevent policy collapse
    use_kl_loss: True            # Required for GRPO
    kl_loss_coef: 0.02           # R18: start at 0.02
    kl_loss_type: low_var_kl
    ppo_epochs: 2                # R18: better sample efficiency
    use_torch_compile: False
    optim:
      lr: 3.0e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.01
  ref:
    strategy: fsdp
    log_prob_use_dynamic_bsz: True
    log_prob_max_token_len_per_gpu: 16384
  rollout:
    name: sglang                 # R9: SGLang for MiniCPM5 (installed). ⚠️ wake409: SGLang rollout DEADLOCKS on init in 1-GPU hybrid colocated mode (7 smoke attempts gpu7..gpu7g hung at verl register-center / actor-unavailable, no error). vLLM rollout alternative needs vllm+msgspec NOT installed (vllm 0.7.3 needs torch 2.5.1, clashes with venv torch 2.6.0+cu124). Full RL run BLOCKED until a throughput rollout engine is fixed. Pipeline smoke uses baize_posttrain_rl_smoke_hf.yaml (HF/NaiveRollout).
    mode: sync                   # R-launch-fix: async deadlocks on 1 GPU ("blocking ray.get inside async actor"); sync for single-turn R0.
    temperature: 0.7
    top_p: 0.95
    prompt_length: 8192              # R61: total ctx=16384
    response_length: 8192            # R61
    gpu_memory_utilization: 0.50     # R61: R11 recommended 0.50 for multi-turn KV budget
    enforce_eager: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 16384    # R61: match ctx=16384
    max_num_seqs: 24                 # R61: R11 calibrates to 2×G per GPU × safety
    n: 8                         # R47 BUG3 FIX: G=8
    multi_turn:
      enable: False              # R47: Start SINGLE-TURN (R0 skeleton, no tools)
      max_turns: 3
      tool_config_path: null     # R47 BUG5 FIX
      format: chatml
    engine_kwargs:
      sglang:
        attention_backend: flashinfer

reward_model:
  enable: False                  # No external RM; using custom_reward_function
  reward_manager: naive          # NaiveRewardManager calls compute_score per sample

algorithm:
  adv_estimator: grpo            # R47 BUG2 FIX
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1

critic:
  strategy: fsdp
  rollout_n: 8                   # Must match actor_rollout_ref.rollout.n

trainer:
  total_epochs: 1
  total_training_steps: 2000
  save_freq: 200
  project_name: baize_posttrain
  experiment_name: rl_grpo_surrogate
  logger: ['console']
  log_val_generations: 0
  nnodes: 1
  n_gpus_per_node: 4             # R47
  resume_mode: auto
  val_before_train: False
  test_freq: -1
  default_local_dir: /nas_data/app.e0031982/code/super_intelligence_2035/doc/BaiZe-ISEDA2027/run/rl_surrogate_runs/minicpm5_grpo_v1
  max_actor_ckpt_to_keep: 3
  device: cuda

ray_init:
  num_cpus: null
  timeline_json_file: null
